services:
  - type: web
    name: slaydai-pro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ADMIN_IDS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: PAYME_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: FREE_GENERATIONS
        value: "3"
      - key: GENERATION_PRICE_UZS
        value: "4000"
      - key: REFERRAL_BONUS_UZS
        value: "1000"
      - key: BOT_NAME
        value: SlaydAI Pro
